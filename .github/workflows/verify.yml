name: Java build and smoke tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac EnvironmentalMonitoringSystemV2.java
      - run: |
          timeout 45 java EnvironmentalMonitoringSystemV2 > output.txt
          grep -q 'Total readings' output.txt
          grep -q 'Air quality readings' output.txt
